# Guardian - entorno completo
#
# Tres servicios monitoreados con perfiles distintos, mas el proxy de
# solo lectura hacia el demonio de Docker:
#
#   app-demo       axios@0.21.0 vulnerable    fallo por excepcion (exit 1)
#   worker-jobs    minimist@1.2.0 vulnerable  fallo por memoria   (exit 137)
#   clean-service  sin dependencias           fallo por config    (exit 1)
#
#   docker compose up -d --build

services:

  app-demo:
    build: ./app-demo
    container_name: app-demo
    # "no" es intencional: si Docker lo reiniciara solo, el incidente
    # duraria segundos y n8n no alcanzaria a detectarlo.
    restart: "no"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks: [guardian-net]

  # Fallo por agotamiento de memoria.
  # El limite de 96 MB es lo que hace que Docker lo mate con codigo 137.
  worker-jobs:
    build: ./worker-jobs
    container_name: worker-jobs
    restart: "no"
    mem_limit: 96m
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks: [guardian-net]

  # Prueba de control: sin dependencias, sin vulnerabilidades que correlacionar.
  clean-service:
    build: ./clean-service
    container_name: clean-service
    restart: "no"
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks: [guardian-net]

  # Proxy de solo lectura al socket de Docker.
  # n8n NO habla con el socket directamente: habla con este proxy,
  # que solo permite las operaciones marcadas con 1.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [guardian-net]

networks:
  guardian-net:
    external: true

# Guardian — entorno completo de pruebas
#
# Tres servicios con perfiles distintos, para demostrar que el sistema
# discrimina en lugar de responder siempre lo mismo:
#
#   app-demo       axios@0.21.0 vulnerable   fallo por excepción (exit 1)
#   worker-jobs    minimist@1.2.0 vulnerable fallo por memoria    (exit 137)
#   clean-service  sin dependencias          fallo por config     (exit 1)
#
# Los dos primeros deben correlacionarse con una vulnerabilidad conocida.
# El tercero NO, y esa es la prueba de control.
#
#   docker compose up -d --build

services:

  app-demo:
    build: ./app-demo
    container_name: app-demo
    restart: "no"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks: [guardian-net]

  # Fallo por agotamiento de memoria.
  # El límite de 96 MB es lo que hace que Docker lo mate con código 137
  # en lugar de que Node lance su propio error.
  worker-jobs:
    build: ./worker-jobs
    container_name: worker-jobs
    restart: "no"
    mem_limit: 96m
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks: [guardian-net]

  # Prueba de control: sin dependencias, sin vulnerabilidades que correlacionar.
  clean-service:
    build: ./clean-service
    container_name: clean-service
    restart: "no"
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks: [guardian-net]

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [guardian-net]

networks:
  guardian-net:
    external: true

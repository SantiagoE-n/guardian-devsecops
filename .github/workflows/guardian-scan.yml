# .github/workflows/guardian-scan.yml
#
# Corre Trivy en cada Pull Request y envía el resultado
# al webhook de n8n (Guardian - Flujo 1).
#
# Requiere un secret en el repo:
#   GUARDIAN_WEBHOOK  ->  https://TU-NGROK.ngrok-free.dev/webhook/guardian-scan

name: Guardian - Escaneo de seguridad

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # Trivy necesita un lockfile para detectar dependencias de npm.
      # Si el repo no lo tiene commiteado, lo generamos al vuelo.
      - name: Preparar lockfile
        run: |
          if [ -f package.json ] && [ ! -f package-lock.json ]; then
            echo "No hay package-lock.json, generándolo..."
            npm install --package-lock-only --ignore-scripts
          fi
          ls -la

      - name: Ejecutar Trivy (dependencias y archivos)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'   # no truena el pipeline; Guardian decide qué hacer

      - name: Compactar resultados
        id: resumen
        run: |
          # Nos quedamos solo con lo que el agente necesita, para no mandar un JSON gigante
          jq '{
            vulnerabilidades: [
              .Results[]?.Vulnerabilities[]? | {
                cve:        .VulnerabilityID,
                severidad:  .Severity,
                paquete:    .PkgName,
                version:    .InstalledVersion,
                fix:        .FixedVersion,
                titulo:     .Title
              }
            ]
          }' trivy-results.json > resumen.json

          TOTAL=$(jq '.vulnerabilidades | length' resumen.json)
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Trivy encontró $TOTAL vulnerabilidades"
          jq -r '.vulnerabilidades[] | "  - \(.severidad)\t\(.cve)\t\(.paquete) \(.version)"' resumen.json

      - name: Enviar a Guardian (n8n)
        env:
          PR_NUM:    ${{ github.event.pull_request.number }}
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_AUTOR:  ${{ github.event.pull_request.user.login }}
          PR_RAMA:   ${{ github.head_ref }}
          PR_REPO:   ${{ github.repository }}
          PR_URL:    ${{ github.event.pull_request.html_url }}
          WEBHOOK:   ${{ secrets.GUARDIAN_WEBHOOK }}
        run: |
          jq -n \
            --slurpfile scan resumen.json \
            --arg pr       "$PR_NUM" \
            --arg titulo   "$PR_TITULO" \
            --arg autor    "$PR_AUTOR" \
            --arg rama     "$PR_RAMA" \
            --arg repo     "$PR_REPO" \
            --arg url      "$PR_URL" \
            '{
              pr:     ($pr | tonumber),
              titulo: $titulo,
              autor:  $autor,
              rama:   $rama,
              repo:   $repo,
              url:    $url,
              hallazgos: $scan[0].vulnerabilidades
            }' > payload.json

          echo "Payload que se envía a Guardian:"
          jq '.' payload.json

          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data @payload.json \
            --max-time 60
